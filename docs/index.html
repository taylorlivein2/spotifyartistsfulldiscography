function generateRandomString(len) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let str = "";
  for (let i = 0; i < len; i++)
    str += chars.charAt(Math.floor(Math.random() * chars.length));
  return str;
}

function base64url(buf) {
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function sha256(bytes) {
  return crypto.subtle.digest("SHA-256", bytes);
}

async function startAuth() {
  const verifier = generateRandomString(128);
  sessionStorage.setItem("code_verifier", verifier);

  const challenge = base64url(
    await sha256(new TextEncoder().encode(verifier))
  );

  window.location =
    "https://accounts.spotify.com/authorize?" +
    new URLSearchParams({
      response_type: "code",
      client_id: clientId,
      scope: scopes,
      redirect_uri: redirectUri,
      code_challenge_method: "S256",
      code_challenge: challenge,
      show_dialog: "true",
    });
}

async function getTokenFromCode() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (!code) return null;

  const verifier = sessionStorage.getItem("code_verifier");

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: "authorization_code",
    code,
    redirect_uri: redirectUri,
    code_verifier: verifier,
  });

  const resp = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });

  const data = await resp.json();
  if (data.access_token) {
    sessionStorage.setItem("spotify_token", data.access_token);
    history.replaceState({}, document.title, redirectUri);
    return data.access_token;
  }
  return null;
}

// ==============================
// RATE-LIMITED FETCH (FROM ORIGINAL FILE)
// ==============================
let requestQueue = [];
let processing = false;
let globalDelay = 0;

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function queueRequest(task) {
  return new Promise((resolve, reject) => {
    requestQueue.push({ task, resolve, reject });
    if (!processing) processQueue();
  });
}

async function processQueue() {
  processing = true;
  while (requestQueue.length) {
    const { task, resolve, reject } = requestQueue.shift();
    if (globalDelay) await sleep(globalDelay);
    try { resolve(await task()); }
    catch (e) { reject(e); }
  }
  processing = false;
}

async function safeFetch(url, method="GET", body=null, headers={}) {
  return queueRequest(async () => {
    const resp = await fetch(url, { method, headers, body });
    if (resp.status === 429) {
      const retry = (parseInt(resp.headers.get("Retry-After")) || 2) * 1000;
      print("429 — waiting " + retry + "ms");
      globalDelay = retry;
      await sleep(retry);
      globalDelay = 0;
      return safeFetch(url, method, body, headers);
    }
    if (!resp.ok) throw new Error(await resp.text());
    return resp.json();
  });
}

var THRESHOLD = 5; // in seconds
function CompareFilterIDs(f1,f2,a1,a2)
{

		var found = false;
		var words = ["recorded","imagined","imagining","recording","master"];
		words.forEach(function(word) {
			var prefixes = ["re","re\-"];
			prefixes.forEach(function(prefix) {
				var f1Contains = f1.includes(prefix+word) || a1.includes(prefix+word);
				var f2Contains = f2.includes(prefix+word) || a2.includes(prefix+word);
				//print("a2: "+a2+" / "+prefix+word+" "+(f1Contains ? "true" : "false")+" "+(f2Contains ? "true" : "false"),true);
				if( (f1Contains && !f2Contains) || (f2Contains && !f1Contains))
				{
					found = true;
					return;
				}
			});
			if(found)
			{
				return;
			}
		});
		if(found)
		{
			return false;
		}
		var split1 = f1.split(CentralPart); // Get the song name, and the time separately
		var split2 = f2.split(CentralPart); // Same for the second song
		if(split1[0]!=split2[0]) // If the songs are different...
		{
			return false;
		}
		else // Same song, different length
		{
			return (Math.abs(parseInt(split1[1])-parseInt(split2[1])) < THRESHOLD*1000);
		}
	}
}

			}
		}
